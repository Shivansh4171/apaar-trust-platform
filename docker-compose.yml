services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apaar
      POSTGRES_PASSWORD: apaar_dev_only
      POSTGRES_DB: apaar_trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaar -d apaar_trust"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
